name: zerotrust_assist
description: "Zero-Trust Assist: a private AI assistant that runs on your phone."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.10.7
  flutter: ">=3.38.6"

# Builds SQLite3MultipleCiphers instead of plain SQLite, so the core's local
# store is encrypted as a whole file (see Zero-Trust-Core README, "Sync").
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Shared account, keys, sync, settings and look of every Zero-Trust app.
  # Never add cryptography_flutter: it breaks the core's key derivation.
  zero_trust_core:
    git:
      url: https://github.com/EdoSag/Zero-Trust-Core.git
      path: packages/zero_trust_core
      ref: v1.0.1
  # The way other Zero-Trust apps ask ZT Assist. Used here by the link test
  # under Settings, Phone test, which asks like another app would. Pinned to
  # a commit until a core release holds the package; then the same tag as
  # zero_trust_core.
  zt_assist:
    git:
      url: https://github.com/EdoSag/Zero-Trust-Core.git
      path: packages/zt_assist
      ref: c07c34480b974bff0b4549b8686716ba0ce9024a
  flutter_riverpod: ^3.5.0
  supabase_flutter: ^2.9.0
  # Reset links from account emails (IncomingLinks).
  app_links: ">=6.4.0 <8.0.0"
  flutter_dotenv: ^6.0.1
  intl: any
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  # Runs the models: llama.cpp for GGUF files and LiteRT-LM for .litertlm
  # files, behind one Dart API. Pinned exactly: it downloads prebuilt native
  # libraries at build time, so a version change is a supply-chain change and
  # gets its own PR. The app only talks to it through lib/engine/.
  llamadart: 0.20.7
  # Where the models and the saved test results live.
  path_provider: ^2.1.5
  # Hands a results file to the system share sheet.
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
